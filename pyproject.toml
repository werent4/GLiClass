[tool.poetry]
name = "gliclass"
version = "0.1.11"
description = "Generalist and Lightweight Model for Text Classification"
authors = ["knowledgator.com"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
torch = "^2.0.0"
torchaudio = "^2.0.0"
transformers = ">=4.37.2,<=4.48.2"
scikit-learn = "^1.0.0"
numpy = "^1.26.4"
pre-commit = "^4.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | models_sampled
  | datasets
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = ["models_sampled", "datasets"]

[tool.ruff]
line-length = 88
target-version = "py39"

select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
    "F401",  # imported but unused (часто используется в __init__.py)
    "E203",  # whitespace before ':'
]

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "models_sampled",
    "datasets",
    "notebooks",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"test_*.py" = ["F401", "F811"]  # Allow unused imports and redefined names in tests
"demo.py" = ["F401", "E402"]  # Allow unused imports and imports not at top

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "transformers.*",
    "sklearn.*",
    "datasets.*",
    "gradio.*",
    "tqdm.*",
    "numpy.*",
    "llm2vec.*",
    "peft.*",
    "turbot5.*",
    "flashdeberta.*",
]
ignore_missing_imports = true

[tool.pydocstyle]
convention = "google"
add-ignore = ["D100", "D104", "D105", "D107", "D203", "D213"]
match-dir = "^(?!models_sampled|datasets|notebooks).*"

[tool.bandit]
exclude_dirs = ["tests", "test_*.py", "models_sampled", "datasets", "notebooks"]
skips = ["B101", "B601", "B311"]
